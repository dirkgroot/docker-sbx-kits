# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Mise en place mixin

capabilities:
  - type: com.docker.sandbox/network-policy@2
    config:
      runtime:
        allow: [ mise.jdx.dev ]
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: "mise activate >> /etc/sandbox-persistent.sh"
          user: "1000"
      startup:
        - command: [ 'sh', '-c', '"mise" trust "${WORKSPACE_DIR:?WORKSPACE_DIR is not set}"' ]
          env: [ WORKSPACE_DIR ]

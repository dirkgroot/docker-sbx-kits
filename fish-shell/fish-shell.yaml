# syntax=docker/sandbox-kit:3
# yaml-language-server: $schema=https://raw.githubusercontent.com/docker/sandbox-kit-spec/main/schema/kit.schema.json
schemaVersion: "3"
kind: mixin
displayName: Fish shell
version: "1.0.0"

args:
  override_entrypoint:
    default: "true"
    description: Overwrite the workload's entrypoint.sh to boot straight into fish. Set to false to leave the entrypoint to another kit.
    enum: [ "true", "false" ]

provides: [ "fish" ]

capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: |
            grep -qx /usr/local/bin/fish /etc/shells 2>/dev/null || printf '%s\n' /bin/sh /bin/bash /usr/local/bin/fish >> /etc/shells
            usermod -s /usr/local/bin/fish agent
        - command: |
            grep -qs '^export SHELL=' /etc/sandbox-persistent.sh || printf 'export SHELL=/usr/local/bin/fish\n' >> /etc/sandbox-persistent.sh
          user: "1000"
        - command: |
            if [ "${{ kit.args.override_entrypoint }}" = "true" ]; then
              printf '#!/usr/bin/env bash\nfish -l\n' > /home/agent/entrypoint.sh
              chmod 0700 /home/agent/entrypoint.sh
            fi
          user: "1000"
